<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="title-parts-box">
        <h2 id="intro-title" style="color: #39FF14; margin: 0 0 10px 0; font-size: 18px;">Refine Your Search</h2>
        <p id="intro-desc" style="font-size: 13px; color: #ccc; margin: 0 0 20px 0; line-height: 1.4;">Sometimes the music title has too many useless/descriptive parts that get in the way of the database search.</p>
        
        <h3 id="how-to-title" style="color: #fff; margin: 0 0 8px 0; font-size: 14px; text-transform: uppercase;">How it works</h3>
        <p id="how-to-desc" style="font-size: 12px; color: #aaa; margin: 0 0 20px 0; line-height: 1.4;">Turn ON/OFF each part 🧩 of the title to pick what you want to search. The app will remember your preference next time.</p>

        <div id="chips"></div>
        <div style="margin-top: auto; padding-top: 20px;">
            <button id="btn-cancel">Cancel</button>
            <button class="primary" id="btn-search">Search Music</button>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
