<?xml version="1.0" encoding="utf-8"?>
<svg id="nanolyrics-master-svg" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                                <defs>
                                    <!-- Degradês Dinâmicos configurados por JS -->
                                    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#0f172a"/>
                                        <stop offset="100%" stop-color="#020617"/>
                                    </linearGradient>
                                    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" id="grad-c1-start" stop-color="#22c55e"/>
                                        <stop offset="100%" id="grad-c1-end" stop-color="#15803d"/>
                                    </linearGradient>
                                    <linearGradient id="secondary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                                        <stop offset="0%" id="grad-c2-start" stop-color="#00ffcc"/>
                                        <stop offset="100%" id="grad-c2-end" stop-color="#22c55e"/>
                                    </linearGradient>
                                    <linearGradient id="lyric-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                                        <stop offset="0%" id="grad-c3-start" stop-color="#FFD700"/>
                                        <stop offset="100%" id="grad-c3-end" stop-color="#ccac00"/>
                                    </linearGradient>
                                    
                                    <!-- Filtro de Glow Retro-futurista -->
                                    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
                                        <feGaussianBlur stdDeviation="12" result="blur"/>
                                        <feMerge>
                                            <feMergeNode in="blur"/>
                                            <feMergeNode in="SourceGraphic"/>
                                        </feMerge>
                                    </filter>
                                </defs>

                                <!-- Molde Principal do Ícone / Squircle Estilo macOS Premium -->
                                <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="8"/>
                                
                                <!-- Grelha de Fundo do Próprio Ícone -->
                                <g id="icon-inner-grid" opacity="0.15">
                                    <line x1="64" y1="128" x2="448" y2="128" stroke="#ffffff" stroke-width="2"/>
                                    <line x1="64" y1="192" x2="448" y2="192" stroke="#ffffff" stroke-width="2"/>
                                    <line x1="64" y1="256" x2="448" y2="256" stroke="#ffffff" stroke-width="2"/>
                                    <line x1="64" y1="320" x2="448" y2="320" stroke="#ffffff" stroke-width="2"/>
                                    <line x1="64" y1="380" x2="448" y2="380" stroke="#ffffff" stroke-width="2"/>
                                    
                                    <line x1="128" y1="64" x2="128" y2="448" stroke="#ffffff" stroke-width="2"/>
                                    <line x1="192" y1="64" x2="192" y2="448" stroke="#ffffff" stroke-width="2"/>
                                    <line x1="256" y1="64" x2="256" y2="448" stroke="#ffffff" stroke-width="2"/>
                                    <line x1="320" y1="64" x2="320" y2="448" stroke="#ffffff" stroke-width="2"/>
                                    <line x1="380" y1="64" x2="380" y2="448" stroke="#ffffff" stroke-width="2"/>
                                </g>

                                <!-- Aro Estilizado com Gradiente de Cor -->
                                <rect x="32" y="32" width="448" height="448" rx="88" fill="none" stroke="url(#secondary-grad)" stroke-width="4" opacity="0.6"/>

                                <!-- Onda/Equalizador Central Integrando o "N" (NanoLyrics) -->
                                <g id="music-waves" filter="url(#neon-glow)">
                                    <!-- Linhas decorativas de onda (Esquerda e Direita do N) -->
                                    <rect x="110" y="210" width="16" height="92" rx="8" fill="url(#primary-grad)" opacity="0.4"/>
                                    <rect x="140" y="160" width="16" height="192" rx="8" fill="url(#primary-grad)" opacity="0.7"/>
                                    <rect x="356" y="160" width="16" height="192" rx="8" fill="url(#primary-grad)" opacity="0.7"/>
                                    <rect x="386" y="210" width="16" height="92" rx="8" fill="url(#primary-grad)" opacity="0.4"/>
                                    
                                    <!-- Pernas e Diagonal do "N" em Onda Estilizada -->
                                    <!-- Haste Esquerda do N -->
                                    <rect id="n-left" x="180" y="110" width="24" height="292" rx="12" fill="url(#secondary-grad)">
                                        <animate attributeName="height" values="292;240;320;292" dur="3s" repeatCount="indefinite" id="anim-nl"/>
                                        <animate attributeName="y" values="110;136;96;110" dur="3s" repeatCount="indefinite" id="anim-nly"/>
                                    </rect>
                                    <!-- Haste Direita do N -->
                                    <rect id="n-right" x="308" y="110" width="24" height="292" rx="12" fill="url(#secondary-grad)">
                                        <animate attributeName="height" values="292;310;230;292" dur="3s" repeatCount="indefinite" id="anim-nr"/>
                                        <animate attributeName="y" values="110;101;141;110" dur="3s" repeatCount="indefinite" id="anim-nry"/>
                                    </rect>
                                    <!-- Diagonal Flutuante Dinâmica -->
                                    <path id="n-diagonal" d="M204 122 L308 390" stroke="url(#secondary-grad)" stroke-width="26" stroke-linecap="round" opacity="0.9">
                                        <animate attributeName="d" values="M204 122 L308 390; M204 148 L308 360; M204 108 L308 410; M204 122 L308 390" dur="3s" repeatCount="indefinite" id="anim-nd"/>
                                    </path>
                                </g>

                                <!-- Letras flutuantes estilizadas / Linhas Horizontais do LRC (Representação de mini-linhas de texto) -->
                                <g id="lyrics-representation" opacity="0.95">
                                    <!-- Linha 1: Desfocada/Futura superior -->
                                    <rect x="186" y="70" width="140" height="12" rx="6" fill="#ffffff" opacity="0.25"/>
                                    
                                    <!-- Linha Principal Activa Centralizada (Em Brilho Amarelo MiniLyrics) -->
                                    <g id="active-line-glow" filter="url(#neon-glow)">
                                        <rect x="136" y="246" width="240" height="20" rx="10" fill="url(#lyric-grad)"/>
                                        <circle cx="160" cy="256" r="4" fill="#000000" opacity="0.4"/>
                                        <circle cx="352" cy="256" r="4" fill="#000000" opacity="0.4"/>
                                    </g>
                                    
                                    <!-- Linha 3: Desfocada inferior -->
                                    <rect x="176" y="430" width="160" height="12" rx="6" fill="#ffffff" opacity="0.2"/>
                                </g>
                            </svg>